spring:
  main:
    web-application-type: none
  datasource:
    url: ${FBO_MIGRATION_DATABASE_URL:${FBO_DATABASE_URL:jdbc:postgresql://localhost:5432/fbo_manager}}
    username: ${FBO_MIGRATION_DATABASE_USERNAME:${FBO_DATABASE_USERNAME:fbo_app}}
    password: ${FBO_MIGRATION_DATABASE_PASSWORD:${FBO_DATABASE_PASSWORD:}}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none

fbo:
  database:
    url: ${FBO_MIGRATION_DATABASE_URL:${FBO_DATABASE_URL:jdbc:postgresql://localhost:5432/fbo_manager}}
    username: ${FBO_MIGRATION_DATABASE_USERNAME:${FBO_DATABASE_USERNAME:fbo_app}}
    password: ${FBO_MIGRATION_DATABASE_PASSWORD:${FBO_DATABASE_PASSWORD:}}
