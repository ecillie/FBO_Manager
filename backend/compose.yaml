name: fbo-manager-backend

services:
  postgres:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_DB: ${FBO_DATABASE_NAME:-fbo_manager}
      POSTGRES_USER: ${FBO_DATABASE_USERNAME:-fbo_app}
      POSTGRES_PASSWORD: ${FBO_DATABASE_PASSWORD:?Set FBO_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${FBO_DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
