name: Backend verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JDK 25 / Maven verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
        env:
          POSTGRES_DB: fbo_manager
          POSTGRES_USER: fbo_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fbo_app -d fbo_manager"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 5s

    defaults:
      run:
        shell: bash
        working-directory: backend

    env:
      FBO_DATABASE_PASSWORD: ci-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify pinned Maven Wrapper
        run: ./mvnw --version

      - name: Validate local PostgreSQL definition
        run: docker compose --env-file .env.example config --quiet

      - name: Test, format-check, and package
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Smoke-test private health probes
        run: |
          set -euo pipefail

          app_log="${RUNNER_TEMP}/fbo-manager.log"
          java -jar target/fbo-manager-0.0.1-SNAPSHOT.jar >"${app_log}" 2>&1 &
          app_pid=$!

          cleanup() {
            kill "${app_pid}" 2>/dev/null || true
            wait "${app_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          started=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8081/actuator/health/liveness >/dev/null; then
              started=true
              break
            fi

            if ! kill -0 "${app_pid}" 2>/dev/null; then
              cat "${app_log}"
              exit 1
            fi

            sleep 1
          done

          if [[ "${started}" != "true" ]]; then
            cat "${app_log}"
            exit 1
          fi

          test "$(curl --fail --silent http://127.0.0.1:8081/actuator/health/liveness)" = '{"status":"UP"}'
          test "$(curl --fail --silent http://127.0.0.1:8081/actuator/health/readiness)" = '{"status":"UP"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/actuator/health/liveness)" = "404"
